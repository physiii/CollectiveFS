<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0e14" />
<title>CollectiveFS</title>
<style>
  :root{
    --accent:#5ee0c8; --accent2:#6d6cf0; --accent-ink:#04120f;
    --fg:#eaf0f6; --muted:#8b93a7; --muted2:#5f6678;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.05);
    --glass:rgba(20,26,38,.62); --glass2:rgba(26,33,48,.55); --menu:#161c28;
    --row:rgba(255,255,255,.018); --row-h:rgba(110,108,240,.10); --row-a:rgba(94,224,200,.12);
    --good:#43d6a0; --warn:#e0b15e; --bad:#e0655e;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    color:var(--fg); overflow:hidden;
    background:linear-gradient(180deg,#10141d 0%,#0a0d14 100%);
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input{font:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:8px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.20);background-clip:content-box}

  /* ---- shell: a single frameless glass window ---- */
  .app{display:flex;flex-direction:column;height:100vh;position:relative;
    /* inner hairline so the frameless window reads as a crisp glass panel */
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05), inset 0 1px 0 rgba(255,255,255,.06)}

  .titlebar{height:52px;position:relative;display:flex;align-items:center;gap:14px;padding:0 12px 0 18px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.008));
    backdrop-filter:blur(18px);-webkit-user-select:none;user-select:none;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:10px;font-weight:680;letter-spacing:.2px;font-size:14px}
  .brand svg{width:30px;height:30px;filter:drop-shadow(0 2px 12px rgba(94,224,200,.55))}
  .brand .nm{background:linear-gradient(90deg,#eaf0f6,#c6cfe0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tabs{display:flex;gap:2px;background:rgba(255,255,255,.045);border:1px solid var(--line);
    border-radius:12px;padding:3px;margin-left:8px}
  .tab{display:flex;align-items:center;gap:7px;padding:6px 15px;border-radius:9px;color:var(--muted);font-weight:600;font-size:12.5px;transition:.15s}
  .tab svg{width:15px;height:15px}
  .tab:hover{color:var(--fg)}
  .tab.active{color:var(--fg);background:linear-gradient(135deg,rgba(94,224,200,.24),rgba(109,108,240,.24));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 2px 10px rgba(0,0,0,.2)}
  .drag{flex:1;align-self:stretch}
  .status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11.5px;margin-right:4px;
    padding:5px 11px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted2);transition:.2s}
  .dot.on{background:var(--good);box-shadow:0 0 9px var(--good)}
  .dot.off{background:var(--bad);box-shadow:0 0 9px rgba(224,101,94,.6)}
  .wc{display:flex;gap:6px;align-items:center}
  .wc button{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:.14s}
  .wc button:hover{background:rgba(255,255,255,.09);color:var(--fg)}
  .wc button.close:hover{background:var(--bad);color:#fff}
  .wc svg{width:12px;height:12px}
  /* running in a plain browser (no Tauri): hide native-window affordances */
  body.web .wc,body.web .rz{display:none}

  /* ---- resize handles (frameless) ---- */
  .rz{position:fixed;z-index:50}
  .rz.n{top:0;left:8px;right:8px;height:5px;cursor:ns-resize}
  .rz.s{bottom:0;left:8px;right:8px;height:5px;cursor:ns-resize}
  .rz.w{left:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}
  .rz.e{right:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}
  .rz.ne{top:0;right:0;width:12px;height:12px;cursor:nesw-resize}
  .rz.nw{top:0;left:0;width:12px;height:12px;cursor:nwse-resize}
  .rz.se{bottom:0;right:0;width:12px;height:12px;cursor:nwse-resize}
  .rz.sw{bottom:0;left:0;width:12px;height:12px;cursor:nesw-resize}

  /* ---- body ---- */
  .body{flex:1;display:flex;min-height:0}
  .side{width:224px;flex:0 0 auto;padding:18px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(255,255,255,.018),transparent)}
  .sidescroll{flex:1;min-height:0;overflow:auto}
  .sidefoot{flex:0 0 auto;border-top:1px solid var(--line);padding-top:10px;margin-top:8px;-webkit-user-select:none;user-select:none}
  .sidefoot .rate{display:flex;gap:14px;font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums;margin-bottom:4px;padding:0 8px}
  .sidefoot .rate .live{color:var(--accent)}
  .sidefoot .store{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 8px 2px}
  .side h4{margin:2px 8px 9px;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted2)}
  .navitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;color:var(--muted);
    font-weight:560;cursor:pointer;transition:.13s;margin-bottom:2px;white-space:nowrap;overflow:hidden}
  .navitem .cnt{margin-left:auto;font-size:11px;color:var(--muted2)}
  .navitem:hover{background:rgba(255,255,255,.045);color:var(--fg)}
  .navitem.active{background:linear-gradient(135deg,rgba(94,224,200,.16),rgba(109,108,240,.16));color:var(--fg);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
  .navitem svg{width:16px;height:16px;opacity:.9;flex:0 0 auto}
  .sidecard{margin-top:20px;padding:13px 13px 11px;border-radius:13px;background:var(--glass2);border:1px solid var(--line);backdrop-filter:blur(12px)}
  .sidecard .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);font-weight:700}
  .sidecard .v{font-size:15px;font-weight:700;margin-top:2px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .sidecard .track{height:6px;border-radius:6px;background:rgba(255,255,255,.08);margin-top:9px;overflow:hidden}
  .sidecard .track>div{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .sidecard .sub{color:var(--muted);font-size:11px;margin-top:7px}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .page{flex:1;overflow:auto;padding:18px 24px 26px}

  /* ---- files toolbar ---- */
  .bar{display:flex;align-items:center;gap:12px;padding:16px 24px 12px}
  .crumbs{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:600;min-width:0;flex-wrap:wrap;padding:14px 24px 0}
  .crumb{color:var(--muted);cursor:pointer;padding:3px 8px;border-radius:8px;white-space:nowrap;transition:.12s}
  .crumb:hover{color:var(--fg);background:rgba(255,255,255,.06)}
  .crumb.cur{color:var(--fg);cursor:default}
  .crumb.cur:hover{background:none}
  .sep{color:var(--muted2)}
  .grow{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);
    border-radius:11px;padding:8px 12px;min-width:200px;backdrop-filter:blur(12px);transition:.14s}
  .search:focus-within{border-color:rgba(94,224,200,.5);box-shadow:0 0 0 3px rgba(94,224,200,.1)}
  .search input{border:0;background:none;outline:none;color:var(--fg);width:100%;font-size:12.5px}
  .search svg{width:15px;height:15px;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:11px;font-weight:600;font-size:12.5px;
    background:var(--glass);border:1px solid var(--line);color:var(--fg);transition:.14s;backdrop-filter:blur(12px);white-space:nowrap}
  .btn:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.07)}
  .btn svg{width:16px;height:16px}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#48cbb2);color:var(--accent-ink);border-color:transparent;
    box-shadow:0 4px 16px rgba(94,224,200,.28)}
  .btn.primary:hover{filter:brightness(1.06);box-shadow:0 6px 20px rgba(94,224,200,.36)}
  .viewtoggle{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:11px;overflow:hidden;backdrop-filter:blur(12px)}
  .viewtoggle button{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);transition:.13s}
  .viewtoggle button:hover{color:var(--fg)}
  .viewtoggle button.active{background:rgba(255,255,255,.09);color:var(--fg)}
  .viewtoggle svg{width:16px;height:16px}

  /* ---- file list ---- */
  .list{display:flex;flex-direction:column;gap:2px}
  .head{display:grid;grid-template-columns:1fr 110px 190px 150px 40px;gap:12px;padding:0 16px 9px;
    color:var(--muted2);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700}
  .row{display:grid;grid-template-columns:1fr 110px 190px 150px 40px;gap:12px;align-items:center;
    padding:11px 16px;border-radius:12px;background:var(--row);border:1px solid transparent;cursor:pointer;transition:.1s}
  .row:hover{background:var(--row-h);border-color:var(--line)}
  .row,.card{user-select:none}
  .row.sel,.card.sel{background:var(--row-a);border-color:rgba(94,224,200,.55);box-shadow:inset 0 0 0 1px rgba(94,224,200,.45)}
  .row.drop-target,.card.drop-target,.navitem.drop-target{outline:2px solid var(--accent);outline-offset:-2px;background:var(--row-a)}
  .up small{display:block;color:var(--muted2);font-size:10.5px;margin-top:2px}
  .nm{display:flex;align-items:center;gap:12px;min-width:0}
  .nm .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
    background:rgba(255,255,255,.05);color:var(--muted)}
  .nm .ic.folder{background:linear-gradient(135deg,rgba(109,108,240,.32),rgba(94,224,200,.2));color:#dfe4ff}
  .nm .ic svg{width:17px;height:17px}
  .nm .t{min-width:0}
  .nm .t b{font-weight:600;font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nm .t small{color:var(--muted2);font-size:11px}
  .sz{color:var(--muted);font-variant-numeric:tabular-nums}
  .dt{color:var(--muted);font-size:12px}
  .shards{display:flex;align-items:center;gap:9px}
  .barwrap{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;max-width:112px}
  .barfill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  .shards small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rowact{display:flex;justify-content:flex-end;gap:2px;opacity:0;transition:.12s}
  .row:hover .rowact{opacity:1}
  .rowact button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
  .rowact button:hover{background:rgba(255,255,255,.11);color:var(--fg)}
  .rowact button.del:hover{background:rgba(224,101,94,.2);color:var(--bad)}
  .rowact svg{width:15px;height:15px}

  /* grid view */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:13px}
  .card{background:var(--row);border:1px solid var(--line2);border-radius:15px;padding:18px 14px;cursor:pointer;
    transition:.13s;text-align:center;position:relative}
  .card:hover{background:var(--row-h);border-color:var(--line);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.28)}
  .card .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;margin:0 auto 11px;
    background:rgba(255,255,255,.05);color:var(--muted)}
  .card .ic.folder{background:linear-gradient(135deg,rgba(109,108,240,.34),rgba(94,224,200,.22));color:#dfe4ff}
  .card .ic svg{width:26px;height:26px}
  .card b{font-size:12.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card small{color:var(--muted2);font-size:11px}

  .empty{text-align:center;color:var(--muted2);padding:80px 20px}
  .empty svg{width:46px;height:46px;opacity:.4;margin-bottom:14px}

  /* drop overlay */
  .drop{position:fixed;inset:0;z-index:60;display:none;place-items:center;
    background:rgba(9,11,18,.74);backdrop-filter:blur(7px)}
  .drop.show{display:grid}
  .drop .inner{border:2px dashed var(--accent);border-radius:22px;padding:54px 76px;text-align:center;
    background:rgba(94,224,200,.07);color:var(--fg);font-size:16px;font-weight:600}
  .drop .inner svg{width:42px;height:42px;margin-bottom:12px;color:var(--accent)}

  /* uploads toast */
  .uploads{position:fixed;right:20px;bottom:20px;z-index:55;display:flex;flex-direction:column;gap:9px;width:290px}
  .up{background:var(--glass);border:1px solid var(--line);border-radius:13px;padding:11px 13px;backdrop-filter:blur(16px);
    box-shadow:0 12px 34px rgba(0,0,0,.4)}
  .up b{font-size:12px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .up .barwrap{max-width:none;margin-top:8px}

  /* ---- performance ---- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
  .stat{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;backdrop-filter:blur(16px);
    position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}
  .stat .lbl{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:8px}
  .stat .lbl svg{width:15px;height:15px;color:var(--accent)}
  .stat .val{font-size:27px;font-weight:700;margin-top:9px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat .val small{font-size:13px;color:var(--muted);font-weight:500}
  .stat .sub{color:var(--muted);font-size:11.5px;margin-top:4px}
  .stat .track{height:7px;border-radius:6px;background:rgba(255,255,255,.08);margin-top:12px;overflow:hidden}
  .stat .track > div{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;backdrop-filter:blur(16px);margin-bottom:14px}
  .panel h3{margin:0 0 2px;font-size:13px;font-weight:670}
  .panel .cap{color:var(--muted);font-size:11.5px;margin-bottom:13px}
  .chart{width:100%;height:120px;display:block}
  .legend{display:flex;gap:16px;margin-top:9px;font-size:11.5px;color:var(--muted)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .place{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .place .r{display:flex;align-items:center;gap:11px;font-size:12.5px}
  .place .r .k{width:158px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .place .r .barwrap{max-width:none}
  .place .r .v{width:62px;text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
  /* clickable metric cards + full-height chart */
  .mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:14px}
  .mcard{text-align:left;padding:13px 15px;border-radius:14px;background:var(--glass);border:1px solid var(--line);cursor:pointer;transition:.13s}
  .mcard:hover{border-color:rgba(255,255,255,.22);transform:translateY(-1px)}
  .mcard.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .mcard .lbl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
  .mcard .lbl svg{width:14px;height:14px}
  .mcard .val{font-size:22px;font-weight:750;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .mcard .sub{color:var(--muted2);font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chartpanel{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;backdrop-filter:blur(14px)}
  .charthead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .charthead h3{margin:0;font-size:12px;color:var(--muted);font-weight:650;letter-spacing:.04em;text-transform:uppercase}
  .charthead .big{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:3px}
  .winbtns{display:flex;gap:3px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:3px}
  .winbtn{padding:5px 13px;border-radius:7px;color:var(--muted);font-weight:600;font-size:12px;transition:.12s}
  .winbtn:hover{color:var(--fg)}
  .winbtn.active{background:var(--accent);color:var(--accent-ink)}
  .chartwrap{position:relative;height:calc(100vh - 340px);min-height:280px;margin-top:16px}
  .bigchart{position:absolute;inset:0;width:100%;height:100%;display:block}
  .chartwrap .yax{position:absolute;top:0;left:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;color:var(--muted2);font-size:11px;font-variant-numeric:tabular-nums}
  .chartempty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted2);font-size:13px}
  .chartfoot{display:flex;gap:20px;margin-top:12px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  /* ---- settings gear + panel ---- */
  .gear{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:.14s}
  .gear:hover{background:rgba(255,255,255,.09);color:var(--fg)}
  .gear svg{width:16px;height:16px}
  .gear.active{background:linear-gradient(135deg,rgba(94,224,200,.24),rgba(109,108,240,.24));color:var(--fg);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .hbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--glass);border:1px solid var(--line);transition:.14s;flex:0 0 auto}
  .hbtn:hover{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:var(--fg)}
  .hbtn svg{width:16px;height:16px}
  .hbtn.accent{background:linear-gradient(135deg,var(--accent),#48cbb2);color:var(--accent-ink);border-color:transparent;box-shadow:0 3px 12px rgba(94,224,200,.28)}
  .hbtn.accent:hover{filter:brightness(1.07)}
  .titlebar .search{position:absolute;left:50%;transform:translateX(-50%);width:min(460px,44vw);flex:none}
  .overlay{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(6,8,13,.62);backdrop-filter:blur(8px)}
  .overlay.show{display:grid}
  .settings{width:min(560px,92vw);max-height:86vh;overflow:auto;border-radius:18px;background:var(--glass);
    border:1px solid var(--line);backdrop-filter:blur(24px);box-shadow:0 30px 80px rgba(0,0,0,.5);padding:22px 24px}
  .settings h2{margin:0 0 2px;font-size:17px;font-weight:700}
  .settings .sub{color:var(--muted);font-size:12px;margin-bottom:20px}
  .settings h3{margin:20px 0 11px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted2);font-weight:700}
  .settings .close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
  .settings .close:hover{background:rgba(255,255,255,.1);color:var(--fg)}
  .settings .close svg{width:14px;height:14px}
  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
  .themeopt{cursor:pointer;border-radius:13px;border:1px solid var(--line);background:var(--row);padding:11px;transition:.13s;text-align:left}
  .themeopt:hover{border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
  .themeopt.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(94,224,200,.28) inset,0 0 0 1px var(--accent)}

<script>

  {id:'catppuccin-mocha',name:'Catppuccin Mocha',desc:'Soft pastels',mode:'dark',ui:{app:'#11111B',paper:'#181825',surface:'#313244',text:'#CDD6F4',muted:'#A6ADC8',primary:'#CBA6F7',primaryContrast:'#11111B',secondary:'#89B4FA',success:'#A6E3A1',warning:'#F9E2AF',error:'#F38BA8'}},
  {id:'dracula',name:'Dracula',desc:'Vivid purple',mode:'dark',ui:{app:'#191A21',paper:'#282A36',surface:'#343746',text:'#F8F8F2',muted:'#A7ACD4',primary:'#BD93F9',primaryContrast:'#282A36',secondary:'#FF79C6',success:'#50FA7B',warning:'#FFB86C',error:'#FF5555'}},
  {id:'gruvbox-dark',name:'Gruvbox Dark',desc:'Warm retro',mode:'dark',ui:{app:'#1D2021',paper:'#282828',surface:'#3C3836',text:'#EBDBB2',muted:'#BDAE93',primary:'#B8BB26',primaryContrast:'#282828',secondary:'#8EC07C',success:'#B8BB26',warning:'#FABD2F',error:'#FB4934'}},
  {id:'tokyo-night',name:'Tokyo Night',desc:'City-blue',mode:'dark',ui:{app:'#16161E',paper:'#1A1B26',surface:'#292E42',text:'#C0CAF5',muted:'#9AA5CE',primary:'#7AA2F7',primaryContrast:'#16161E',secondary:'#BB9AF7',success:'#9ECE6A',warning:'#E0AF68',error:'#F7768E'}},
  {id:'solarized-light',name:'Solarized Light',desc:'Daylight',mode:'light',ui:{app:'#EEE8D5',paper:'#FDF6E3',surface:'#E5DEC9',text:'#111111',muted:'#34454B',primary:'#005F5A',primaryContrast:'#FFFFFF',secondary:'#084F83',success:'#4F5F00',warning:'#9D7700',error:'#DC322F'}},
];
const THEME_KEY='cfs:theme', DEFAULT_THEME='neon-mint';
const _rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));};
const rgba=(h,a)=>{const [r,g,b]=_rgb(h);return `rgba(${r},${g},${b},${a})`;};
function getTheme(id){return THEMES.find(t=>t.id===id)||THEMES.find(t=>t.id===DEFAULT_THEME);}
function applyTheme(id){
  const t=getTheme(id), u=t.ui, dark=t.mode==='dark', r=document.documentElement.style;
  r.setProperty('--accent',u.primary); r.setProperty('--accent2',u.secondary); r.setProperty('--accent-ink',u.primaryContrast);
  r.setProperty('--fg',u.text); r.setProperty('--muted',u.muted); r.setProperty('--muted2',rgba(u.muted,.62));

  r.setProperty('--glass',rgba(u.surface,dark?.62:.74)); r.setProperty('--glass2',rgba(u.paper,dark?.55:.72));

  THEMES.forEach(t=>{
    const u=t.ui;
    const o=el('button','themeopt',
      '<div class="prev"><div class="bg" style="background:linear-gradient(135deg,'+u.paper+','+u.app+')">'+
        '<span class="sw" style="background:'+u.primary+'"></span>'+
        '<span class="sw" style="background:'+u.secondary+'"></span>'+

// ---- api ----
async function api(path, opts={}){
  opts.headers = Object.assign({'x-cfs-token':TOKEN||''}, opts.headers||{});
  const r = await fetch(API+path, opts);
  if(!r.ok) throw new Error(path+' '+r.status);
  const ct = r.headers.get('content-type')||'';
  return ct.includes('json') ? r.json() : r.text();
}
const fmtBytes = n=>{ n=Number(n)||0; if(n<1024)return n+' B'; const u=['KB','MB','GB','TB']; let i=-1; do{n/=1024;i++;}while(n>=1024&&i<u.length-1); return n.toFixed(n<10?1:0)+' '+u[i]; };
const fmtBps = n=>fmtBytes(n)+'/s';
const fmtDate = s=>{ if(!s)return '—'; const d=new Date(s); return isNaN(d)?'—':d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); };

// ---- connection ----
let online=false;
function setNet(ok,label){ online=ok; const d=$('#netdot'); if(d){ d.className='dot '+(ok?'on':'off'); d.title=label||''; } }

// ---- files ----
function downloadViaIframe(id){
  const f=document.createElement('iframe'); f.style.display='none';
  f.src=API+'/api/files/'+id+'/download?x-cfs-token='+encodeURIComponent(TOKEN||'');
  document.body.appendChild(f); setTimeout(()=>f.remove(),60000);
}
async function downloadFile(id,name){
  try{
    const r=await fetch(API+'/api/files/'+id+'/download',{headers:{'x-cfs-token':TOKEN||''}});
    if(!r.ok||!r.body) throw new Error('http '+r.status);
    const reader=r.body.getReader(), chunks=[];
    for(;;){ const {done,value}=await reader.read(); if(done) break; chunks.push(value); bumpDown(value.length); }
    const url=URL.createObjectURL(new Blob(chunks));
    const a=el('a'); a.href=url; a.download=name||'download'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);
  }catch(e){ downloadViaIframe(id); }
}
async function loadFolder(p){
  PATH=p;
  try{
    const d=await api('/api/files/browse?scope=network&path='+encodeURIComponent(p));
    DATA=d; setNet(true,(d.file_count||0)+' files · '+fmtBytes(d.size||0));
    renderCrumbs(); renderFiles(); renderPlaces();
  }catch(e){ setNet(false,'node offline'); $('#filespage').innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg><div>Can’t reach the node at '+API+'</div></div>'; }
}
function renderCrumbs(){
  const c=$('#crumbs'); c.innerHTML='';
  if(!PATH){ c.hidden=true; return; }
  c.hidden=false;
  const bc=DATA.breadcrumbs&&DATA.breadcrumbs.length?DATA.breadcrumbs:[{name:'All Files',path:''}];
  bc.forEach((b,i)=>{
    const last=i===bc.length-1;
    const s=el('span','crumb'+(last?' cur':''),b.name); if(!last)s.onclick=()=>loadFolder(b.path);
    c.appendChild(s); if(!last)c.appendChild(el('span','sep','/'));
  });
}
function shardBar(f){

// ---- file-type icons (colour-coded) + thumbnails ----
const EXT={
  image:['png','jpg','jpeg','gif','webp','bmp','svg','heic','heif','avif','tif','tiff','ico'],
  video:['mp4','mov','mkv','webm','avi','m4v','wmv','flv','mpg','mpeg'],
  audio:['mp3','wav','flac','ogg','oga','m4a','aac','opus','wma'],
  pdf:['pdf'],
  archive:['zip','tar','gz','tgz','bz2','xz','7z','rar','zst'],
  code:['js','mjs','cjs','ts','tsx','jsx','py','go','rs','c','h','cc','cpp','hpp','java','kt','rb','php','sh','bash','zsh','json','yaml','yml','toml','ini','html','htm','css','scss','sql','xml'],
  sheet:['csv','tsv','xls','xlsx','ods'],
  doc:['txt','md','markdown','rst','rtf','doc','docx','odt','log','tex'],

function extOf(n){ const m=/\.([A-Za-z0-9]+)$/.exec(n||''); return m?m[1].toLowerCase():''; }

const GLYPH={

async function copyFile(f){
  toast('Copying '+f.name+'…');
  try{
    const r=await fetch(thumbUrl(f)); if(!r.ok) throw new Error('read '+r.status);
    const blob=await r.blob();
    const dot=f.name.lastIndexOf('.'); const nm=dot>0?f.name.slice(0,dot)+' copy'+f.name.slice(dot):f.name+' copy';
    const fd=new FormData(); fd.append('file',new File([blob],nm)); fd.append('folder',PATH); fd.append('symlink','');
    const up=await fetch(API+'/api/files/upload',{method:'POST',headers:{'x-cfs-token':TOKEN||''},body:fd});
    if(!up.ok) throw new Error('upload '+up.status);
    toast('Copied to “'+nm+'”'); loadFolder(PATH);
  }catch(e){ alert('Copy failed: '+e.message+'\n(A just-uploaded file needs a moment to distribute before it can be copied.)'); }
}

function uploadFiles(files){

    const xhr=new XMLHttpRequest(); xhr.open('POST',API+'/api/files/upload');
    xhr.setRequestHeader('x-cfs-token',TOKEN||'');
    xhr.upload.onprogress=e=>{ if(e.lengthComputable) fill.style.width=Math.round(e.loaded/e.total*100)+'%'; bumpUp(e.loaded-last); last=e.loaded; };
    xhr.onload=()=>{ fill.style.width='100%'; card.querySelector('b').textContent=(xhr.status<300?'✓ ':'✕ ')+file.name; if(sub) sub.textContent=xhr.status<300?'stored · distributing shards':'upload failed'; setTimeout(()=>card.remove(),1800); if(xhr.status<300) loadFolder(PATH); };
    xhr.onerror=()=>{ card.querySelector('b').textContent='✕ '+file.name; if(sub) sub.textContent='upload failed'; setTimeout(()=>card.remove(),2600); };
    xhr.send(fd);
  });
}
// ---- transfer rate (this machine; driven by the app's own uploads/downloads) ----
const RATE={up:0,down:0};
function bumpUp(n){ RATE.up+=n||0; } function bumpDown(n){ RATE.down+=n||0; }
setInterval(()=>{ const u=$('#up'),d=$('#down'); if(u){u.textContent='↑ '+fmtBps(RATE.up);u.classList.toggle('live',RATE.up>0);} if(d){d.textContent='↓ '+fmtBps(RATE.down);d.classList.toggle('live',RATE.down>0);} RATE.up=0; RATE.down=0; },1000);

// ---- drag & drop upload ----
// Internal item-move drags carry 'text/cfs-move' and must NOT trigger the upload overlay.
let dragc=0;
const isFileDrag=e=>[...(e.dataTransfer?e.dataTransfer.types:[])].includes('Files');
window.addEventListener('dragenter',e=>{ if(!isFileDrag(e)||TAB!=='files')return; e.preventDefault(); dragc++; $('#droppath').textContent=PATH||'All Files'; $('#drop').classList.add('show'); });
window.addEventListener('dragover',e=>{ if(isFileDrag(e)) e.preventDefault(); });
window.addEventListener('dragleave',e=>{ if(!isFileDrag(e))return; if(--dragc<=0)$('#drop').classList.remove('show'); });
window.addEventListener('drop',e=>{ if(!isFileDrag(e))return; e.preventDefault(); dragc=0; $('#drop').classList.remove('show'); if(TAB==='files'&&e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); });
// Desktop (Tauri): OS file drops arrive as native events carrying file PATHS —
// read each via the read_dropped command, then upload with progress.
if(TW && window.__TAURI__ && window.__TAURI__.event){
  const EV=window.__TAURI__.event, INV=window.__TAURI__.core&&window.__TAURI__.core.invoke;
  EV.listen('tauri://drag-enter',()=>{ if(TAB==='files'){ $('#droppath').textContent=PATH||'All Files'; $('#drop').classList.add('show'); } });
  EV.listen('tauri://drag-leave',()=>$('#drop').classList.remove('show'));
  EV.listen('tauri://drag-drop', async ev=>{
    $('#drop').classList.remove('show'); if(TAB!=='files'||!INV) return;
    const paths=(ev.payload&&ev.payload.paths)||[]; const out=[];
    for(const p of paths){ try{ const buf=await INV('read_dropped',{path:p}); out.push(new File([buf], p.split(/[\\/]/).pop()||'file')); }catch(err){ toast('Could not read '+p); } }
    if(out.length) uploadFiles(out);
  });
}
// ---- keyboard: delete selection / clear / select-all ----
window.addEventListener('keydown',e=>{
  if(TAB!=='files') return; const t=(e.target.tagName||'').toLowerCase(); if(t==='input'||t==='textarea') return;
  if(e.key==='Delete'||e.key==='Backspace'){ if(SEL.size){ e.preventDefault(); deleteSelection(); } }
  else if(e.key==='Escape'){ clearSel(); }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){ e.preventDefault(); SEL=new Set(ORDER); applySel(); }
});
$('#q').oninput=e=>{QUERY=e.target.value; renderFiles();};
$('#v-list').onclick=()=>{VIEW='list';$('#v-list').classList.add('active');$('#v-grid').classList.remove('active');renderFiles();};
$('#v-grid').onclick=()=>{VIEW='grid';$('#v-grid').classList.add('active');$('#v-list').classList.remove('active');renderFiles();};

// ---- tabs ----
function selectTab(name){
  TAB=name;
  $('#view-files').style.display = name==='files'?'flex':'none';
  $('#view-perf').style.display = name==='perf'?'block':'none';
  const pb=$('#perfbtn'); if(pb) pb.classList.toggle('active',name==='perf');
  if(name==='perf') startPerf(); else stopPerf();
}
$('#perfbtn').onclick=()=>selectTab(TAB==='perf'?'files':'perf');

// ---- performance: clickable metric cards + a full-height chart with time windows ----
let perfTimer=null, HIST=[], SELM='read_bps', SELW=300;
const storageIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>';
const shieldIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v6c0 5-3.4 7.7-7 9-3.6-1.3-7-4-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>';
const dlIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v12M7 11l5 5 5-5"/></svg>';
const ulIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20V8M7 13l5-5 5 5"/></svg>';
const opsIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>';
const latIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const netIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="18" r="2.2"/><path d="M12 7.2v3.6M10.5 13l-3.5 3M13.5 13l3.5 3"/></svg>';
const PMETRICS=[
  {k:'used',label:'Space',color:'#43d6a0',fmt:fmtBytes,icon:storageIcon},
  {k:'durability',label:'Durability',color:'#7ea7ff',fmt:v=>(v||0).toFixed(1)+'%',icon:shieldIcon},
  {k:'read_bps',label:'Read',color:'#5ee0c8',fmt:fmtBps,icon:dlIcon},
  {k:'write_bps',label:'Write',color:'#6d6cf0',fmt:fmtBps,icon:ulIcon},
  {k:'ops_per_sec',label:'Ops',color:'#e0b15e',fmt:v=>(v||0).toFixed(0)+'/s',icon:opsIcon},
  {k:'avg_latency_ms',label:'Latency',color:'#e0655e',fmt:v=>(v||0).toFixed(0)+' ms',icon:latIcon},
  {k:'peers',label:'Peers',color:'#c792ea',fmt:v=>String(Math.round(v||0)),icon:netIcon},
];
const WINDOWS=[[60,'1m'],[300,'5m'],[900,'15m'],[3600,'1h']];
function seedHist(mx){ if(HIST.length) return; const s=mx.series||[], n=s.length, now=Date.now(); s.forEach((p,i)=>HIST.push({t:now-(n-1-i)*1000,read_bps:p.read_bps||0,write_bps:p.write_bps||0,ops_per_sec:p.ops_per_sec||0,avg_latency_ms:p.avg_latency_ms||0,used:0,durability:0,peers:0})); }
function pushHist(ov,mx,net,online){ const c=ov.collective||{}, s=(mx.series||[]), last=s[s.length-1]||{}; HIST.push({t:Date.now(),read_bps:last.read_bps||0,write_bps:last.write_bps||0,ops_per_sec:last.ops_per_sec||0,avg_latency_ms:last.avg_latency_ms||0,used:net.used||c.used_bytes||0,durability:c.durability_percent||0,peers:online||0}); const cut=Date.now()-3600*1000; while(HIST.length>1 && HIST[0].t<cut) HIST.shift(); }
function chart(metric){
  const from=Date.now()-SELW*1000, W=1000, H=300;
  const pts=HIST.filter(x=>x.t>=from).map(x=>({x:(x.t-from)/(SELW*1000), v:x[metric.k]||0}));
  if(pts.length<2) return '<div class="chartempty">Collecting live data… keep this page open a moment</div>';
  const max=Math.max(1,...pts.map(p=>p.v));
  const X=p=>(p.x*W).toFixed(1), Y=p=>((1-p.v/max)*H).toFixed(1);
  const d=pts.map((p,i)=>(i?'L':'M')+X(p)+' '+Y(p)).join(' ');
  const area='M'+X(pts[0])+' '+H+' '+pts.map(p=>'L'+X(p)+' '+Y(p)).join(' ')+' L'+X(pts[pts.length-1])+' '+H+' Z';
  let grid=''; for(let i=1;i<4;i++){ const gy=(H*i/4).toFixed(1); grid+='<line x1="0" y1="'+gy+'" x2="'+W+'" y2="'+gy+'" stroke="var(--line)" vector-effect="non-scaling-stroke"/>'; }
  return '<svg class="bigchart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+metric.color+'" stop-opacity=".28"/><stop offset="1" stop-color="'+metric.color+'" stop-opacity="0"/></linearGradient></defs>'+grid+'<path d="'+area+'" fill="url(#cg)"/><path d="'+d+'" fill="none" stroke="'+metric.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
}
async function renderPerf(){
  let ov,mx;
  try{ ov=await api('/api/system/overview'); mx=await api('/api/fs/metrics?window='+SELW); }
  catch(e){ $('#view-perf').innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg><div>Node offline</div></div>'; return; }
  const c=ov.collective||{}, p=ov.peers||{};
  const online=p.online!=null?p.online:((p.items||[]).filter(x=>x.healthy).length), total=p.total!=null?p.total:(p.items||[]).length;
  const net=await networkStorage(ov); seedHist(mx); pushHist(ov,mx,net,online);
  const h=HIST[HIST.length-1]||{};
  const cur={used:net.used,durability:c.durability_percent||0,read_bps:h.read_bps||0,write_bps:h.write_bps||0,ops_per_sec:h.ops_per_sec||0,avg_latency_ms:h.avg_latency_ms||0,peers:online};
  const cards=PMETRICS.map(m=>{
    const sub=m.k==='used'?('of '+fmtBytes(net.pledged)+' · '+net.machines+' machines'):m.k==='durability'?((c.shards_available||0)+'/'+(c.shards_total||0)+' shards'):m.k==='peers'?(total+' known'):'live';
    return '<button class="mcard'+(SELM===m.k?' active':'')+'" data-m="'+m.k+'"><div class="lbl">'+m.icon+m.label+'</div><div class="val"'+(SELM===m.k?' style="color:'+m.color+'"':'')+'>'+m.fmt(cur[m.k]||0)+'</div><div class="sub">'+sub+'</div></button>';
  }).join('');
  const metric=PMETRICS.find(m=>m.k===SELM)||PMETRICS[0];
  const from=Date.now()-SELW*1000, vv=HIST.filter(x=>x.t>=from).map(x=>x[metric.k]||0);
  const peak=vv.length?Math.max(...vv):0, avg=vv.length?vv.reduce((a,b)=>a+b,0)/vv.length:0;
  const winbtns=WINDOWS.map(w=>'<button class="winbtn'+(SELW===w[0]?' active':'')+'" data-w="'+w[0]+'">'+w[1]+'</button>').join('');
  const place=c.placement||{};
  const placeRows=Object.keys(place).sort((a,b)=>place[b]-place[a]).map(k=>{ const label=k==='local'?'This node (local)':k.replace('http://','').replace(':8010',''); const tot=Object.values(place).reduce((a,b)=>a+b,0)||1; const pct=Math.round(place[k]/tot*100); return '<div class="r"><div class="k">'+label+'</div><div class="barwrap"><div class="barfill" style="width:'+pct+'%"></div></div><div class="v">'+place[k]+'</div></div>'; }).join('');
  $('#view-perf').innerHTML=
    '<div class="mcards">'+cards+'</div>'+
    '<div class="chartpanel"><div class="charthead"><div><h3>'+metric.label+'</h3><div class="big" style="color:'+metric.color+'">'+metric.fmt(cur[metric.k]||0)+'</div></div><div class="winbtns">'+winbtns+'</div></div>'+
      '<div class="chartwrap">'+chart(metric)+'<div class="yax"><span>'+metric.fmt(peak)+'</span><span>'+metric.fmt(peak/2)+'</span><span>0</span></div></div>'+
      '<div class="chartfoot"><span>avg '+metric.fmt(avg)+'</span><span>peak '+metric.fmt(peak)+'</span><span>'+vv.length+' samples · '+(WINDOWS.find(w=>w[0]===SELW)||['',''])[1]+'</span></div></div>'+
    '<div class="panel"><h3>Shard placement</h3><div class="cap">Where this node’s '+(c.shards_total||0)+' shards live across the collective</div><div class="place">'+(placeRows||'<div class="cap">No shards yet</div>')+'</div></div>';
  document.querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{ SELM=b.dataset.m; renderPerf(); });
  document.querySelectorAll('.winbtn').forEach(b=>b.onclick=()=>{ SELW=+b.dataset.w; renderPerf(); });
}
function startPerf(){ renderPerf(); stopPerf(); perfTimer=setInterval(renderPerf,2000); }
function stopPerf(){ if(perfTimer){clearInterval(perfTimer);perfTimer=null;} }

// ---- collective-wide storage: pledged/used summed across every machine ----
// A node only knows its OWN quota, so we sum each healthy peer's overview too
// (CORS is open on every node). Throttled + cached so the 3s/8s refreshers
// don't hammer peers; falls back to local-only if a peer is unreachable.
let NET={ts:0, pledged:0, used:0, machines:1};
async function networkStorage(ov){
  if(NET.ts && (Date.now()-NET.ts)<20000) return NET;
  const c=ov.collective||{}; let pledged=c.quota_bytes||0, used=c.used_bytes||0, machines=1;
  const peers=((ov.peers&&ov.peers.items)||[]).filter(p=>p.healthy&&p.url);
  await Promise.all(peers.map(async p=>{
    try{
      const r=await fetch(p.url.replace(/\/+$/,'')+'/api/system/overview',{cache:'no-store'});
      if(!r.ok) return; const pc=((await r.json()).collective)||{};
      pledged+=pc.quota_bytes||0; used+=pc.used_bytes||0; machines++;
    }catch(e){}
  }));
  NET={ts:Date.now(), pledged, used, machines};
  return NET;
}
// ---- storage side card (kept fresh from overview) ----
async function refreshStorage(){
  try{
    const ov=await api('/api/system/overview');
    const net=await networkStorage(ov);
    const sl=$('#store-line'); if(sl) sl.textContent=fmtBytes(net.used)+' of '+fmtBytes(net.pledged);
  }catch(e){}
}

// ---- boot ----
async function boot(){
  for(let i=0;i<30;i++){
    try{ const a=await fetch(API+'/api/account'); if(a.ok){ TOKEN=(await a.json()).token; break; } }catch(e){}
    setNet(false,'connecting…'); await new Promise(r=>setTimeout(r,1000));
  }
  if(!TOKEN){ setNet(false,'node offline'); }
  loadFolder('');
  refreshStorage();
  if(location.hash.indexOf('perf')>=0) selectTab('perf');
  setInterval(()=>{ if(TAB==='files') loadFolder(PATH); refreshStorage(); }, 8000);
}
boot();
</script>
