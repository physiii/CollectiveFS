services:
  collectivefs:
    build: .
    ports:
      - "${CFS_PORT:-8010}:8000"
    labels:
      # Custodian picks this up to link the app card at its real address.
      com.custodian.app.url: "${CFS_OWN_URL:-http://localhost:8010}/"
    volumes:
      - collective_data:/data/.collective
      # Agent CLIs come from the host so the section chats can drive a real
      # model. Without these the node still works — the chat falls back to the
      # built-in interpreter, which applies configuration changes deterministically.
      - ${AGENT_BIN_DIR:-/home/andy/.local/bin}:/opt/agent-bin:ro
      - ${NVM_DIR:-/home/andy/.nvm}:/opt/nvm:ro
      - ${HOME:-/home/andy}/.codewhale:/root/.codewhale:ro
      - ${HOME:-/home/andy}/.claude:/root/.claude:ro
      - ${HOME:-/home/andy}/.codex:/root/.codex:ro
    environment:
      - COLLECTIVE_PATH=/data/.collective
      - ENCODER_PATH=/app/lib/encoder
      - DECODER_PATH=/app/lib/decoder
      # How peers reach this node. Required before it can hand shards out —
      # a peer has to be able to hand them back.
      - OWN_URL=${CFS_OWN_URL:-}
      # Comma-separated peer base URLs, e.g. http://192.168.1.43:8010
      - PEER_URLS=${CFS_PEER_URLS:-}
      # Which agent backend the section chats use by default. Switchable at
      # runtime from the UI; codewhale | claude | codex | builtin.
      - AGENT_PROVIDER=${AGENT_PROVIDER:-codewhale}
      # Container paths first: the mounted host bin dir also holds host-python
      # entry points (uvicorn among them) whose interpreters do not exist here.
      # The node version differs per host, so it comes from .env.
      - PATH=/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/agent-bin:/opt/nvm/versions/node/${CFS_NODE_VERSION:-v22.22.2}/bin
      # The host shims re-exec through an agent-scope wrapper that lives outside
      # this container; skip it and run the real binaries directly.
      - AGENT_SCOPE_DISABLE=1
      - REAL_CODEWHALE_BIN=/opt/nvm/versions/node/${CFS_NODE_VERSION:-v22.22.2}/bin/codewhale
      - REAL_CODEX_BIN=/opt/nvm/versions/node/${CFS_NODE_VERSION:-v22.22.2}/bin/codex
      # Provider credentials are passed through from the launching shell (or a
      # local .env, which is gitignored). Nothing is baked into the image.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  collective_data:
    driver: local
