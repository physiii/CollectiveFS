# macOS single-node compose. Used explicitly:  docker compose -f docker-compose.mac.yml up -d
#
# Unlike docker-compose.yml this does NOT bind-mount the host agent CLIs
# (~/.local/bin, ~/.nvm, ~/.codewhale, ~/.claude, ~/.codex). Those default to
# Linux /home/andy paths and, more importantly, mounting host credentials into a
# node that trades on the network is undesirable. The section chats fall back to
# the deterministic built-in interpreter (AGENT_PROVIDER=builtin).
services:
  collectivefs:
    build: .
    # Build native arm64 on Apple Silicon. (Emulated linux/amd64 segfaults the
    # Go compiler under QEMU; the arm64 psutil wheel gap is handled in
    # api/requirements.txt instead.)
    ports:
      - "${CFS_PORT:-8010}:8000"
    labels:
      com.custodian.app.url: "${CFS_OWN_URL:-http://localhost:8010}/"
    volumes:
      - collective_data:/data/.collective
    environment:
      - COLLECTIVE_PATH=/data/.collective
      - ENCODER_PATH=/app/lib/encoder
      - DECODER_PATH=/app/lib/decoder
      # How peers reach this node — required before it hands shards out.
      - OWN_URL=${CFS_OWN_URL:-}
      # Comma-separated peer base URLs (seed list; the node also gossips).
      - PEER_URLS=${CFS_PEER_URLS:-}
      - PEER_DISCOVERY_INTERVAL=${CFS_PEER_DISCOVERY_INTERVAL:-30}
      - AGENT_PROVIDER=${AGENT_PROVIDER:-builtin}
      - AGENT_SCOPE_DISABLE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  collective_data:
    driver: local
