<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf0f6"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee0c8"/>
      <stop offset="1" stop-color="#6d6cf0"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f8ef5"/>
      <stop offset="1" stop-color="#6d6cf0"/>
    </linearGradient>
  </defs>

  <!-- white background tile (OS masks the corners) -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- soft shadow beneath the stack -->
  <ellipse cx="512" cy="792" rx="260" ry="34" fill="#6d6cf0" opacity="0.12"/>

  <!-- back folder, peeking behind -->
