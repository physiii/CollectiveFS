  <!-- front folder -->
  <path d="M300 430 h150 a32 32 0 0 1 23 10 l44 46 h214 a54 54 0 0 1 54 54 v190 a54 54 0 0 1-54 54 H300 a54 54 0 0 1-54-54 V484 a54 54 0 0 1 54-54 Z"
        fill="url(#teal)"/>

  <!-- subtle highlight on the front lip -->
  <path d="M246 556 h532 v-18 a54 54 0 0 0-54-54 H517 l-44-46 a32 32 0 0 0-23-10 H300 a54 54 0 0 0-54 54 Z"
