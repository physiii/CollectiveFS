<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161d33"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="mesh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee0c8"/>
      <stop offset="1" stop-color="#6d6cf0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#5ee0c8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5ee0c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded-square app tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="222" fill="none" stroke="#2a3450" stroke-width="4" opacity="0.5"/>

  <!-- mesh: hub + 6 nodes -->
  <g transform="translate(512,512)">
    <g stroke="url(#mesh)" stroke-width="26" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="0" x2="0" y2="-232"/>
      <line x1="0" y1="0" x2="201" y2="-116"/>
      <line x1="0" y1="0" x2="201" y2="116"/>
      <line x1="0" y1="0" x2="0" y2="232"/>
      <line x1="0" y1="0" x2="-201" y2="116"/>
      <line x1="0" y1="0" x2="-201" y2="-116"/>
    </g>
    <g fill="url(#mesh)">
      <circle cx="0" cy="-232" r="52"/>
      <circle cx="201" cy="-116" r="52"/>
      <circle cx="201" cy="116" r="52"/>
      <circle cx="0" cy="232" r="52"/>
      <circle cx="-201" cy="116" r="52"/>
      <circle cx="-201" cy="-116" r="52"/>
    </g>
    <!-- hub -->
    <circle cx="0" cy="0" r="82" fill="#0a0d16" stroke="url(#mesh)" stroke-width="30"/>
    <circle cx="0" cy="0" r="26" fill="url(#mesh)"/>
  </g>
</svg>
