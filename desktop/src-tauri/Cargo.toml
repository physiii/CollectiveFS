[package]
name = "collectivefs-desktop"
version = "1.0.0"
description = "CollectiveFS — native desktop client for the CollectiveFS node console"
authors = ["CollectiveFS"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "collectivefs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
